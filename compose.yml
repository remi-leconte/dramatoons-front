services:
  front:
    build:
      context: .
    restart: unless-stopped
    networks:
      - api_internal_network
      - global_proxy_network
    environment:
      - VITE_API_URL=http://localhost:8081

networks:
  api_internal_network:
    external: true
    name: shared_api_network
  global_proxy_network:
    external: true

volumes:
  dramatoons_front_data: