services:
  dramatoons_front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dramatoons_front
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - api_internal_network
    environment:
      - VITE_API_URL=http://dramatoons.local

networks:
  api_internal_network:
    external: true
    name: shared_api_network
