server {
    listen 80;
    root /usr/share/nginx/html;

    # Fichiers construits par Vite : leur nom contient une empreinte qui change à chaque version,
    # ils peuvent donc rester longtemps en cache. Un fichier d'une ancienne version, absent de
    # l'image, renvoie 404 : sans try_files, il serait servi par index.html (du HTML au lieu du JS).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html désigne les fichiers de la version en cours : le navigateur le revalide à chaque
    # visite, sinon il garde après une mise en production un index qui réclame des fichiers disparus
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
